name: CI & Deploy

on:
  push:
    branches: [main, "claude/**", "redesign/**"]
  pull_request:
  workflow_dispatch:

# Runs that can deploy (main pushes, manual runs) share one "production" lock, so a
# deploy + smoke test finishes before the next one starts. Other runs only test.
concurrency:
  group: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch') && 'production' || format('ci-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Backend — install, typecheck, unit tests
        working-directory: backend
        run: npm ci && npm run typecheck && npm test
      - name: Frontend — install, typecheck, static build
        working-directory: frontend
        run: npm ci && npm run typecheck && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-out
          path: frontend/out
          retention-days: 3

  deploy:
    # Deploys the single production Worker. Only main deploys automatically;
    # feature branches run tests only (a manual "Run workflow" can deploy one).
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VISITOR_SALT: ${{ secrets.VISITOR_SALT }}
      ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: frontend-out
          path: frontend/out
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Deploy to Cloudflare
        run: bash infra/scripts/deploy.sh

  smoke-test:
    # End-to-end check of the LIVE deployment: register, wizard, moderation, follow, logout.
    needs: deploy
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      APP_URL: https://volunteerhub.ivan-antonenko.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install tools
        run: |
          (cd backend && npm ci)
          (cd infra/e2e && npm install && npx playwright install --with-deps chromium)
      - name: Health check
        run: curl -fsS "$APP_URL/api/health"
      - name: Run live smoke test
        working-directory: infra/e2e
        run: |
          node smoke.cjs "$APP_URL" "$GITHUB_WORKSPACE/backend/node_modules/.bin/wrangler d1 execute DB --remote --config $GITHUB_WORKSPACE/infra/cloudflare/wrangler.toml --command \"UPDATE users SET role='admin' WHERE email='EMAIL'\""
      - name: Remove smoke-test data
        if: always()
        run: backend/node_modules/.bin/wrangler d1 execute DB --remote --config infra/cloudflare/wrangler.toml --file infra/e2e/cleanup.sql
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: infra/e2e/screenshots
          retention-days: 7
