# Local development config for the API only (`npm run dev` → http://localhost:8787).
# The production config (API + frontend assets) is in ../infra/cloudflare/wrangler.toml.
name = "volunteerhub-api-dev"
main = "src/index.ts"
compatibility_date = "2025-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "development"
ALLOWED_ORIGINS = "http://localhost:3000,http://localhost:5173"
GOOGLE_CLIENT_ID = "994822121085-m28q8e8mlvb1vudambms6ejlr3934l5o.apps.googleusercontent.com"

[[d1_databases]]
binding = "DB"
database_name = "volunteerhub-db"
database_id = "local-dev"
migrations_dir = "migrations"
